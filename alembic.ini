# Alembic configuration for Review Agent migrations

[alembic]
script_location = src/review/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src .
timezone = UTC

# Default database connection for migration commands
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/review_agent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
