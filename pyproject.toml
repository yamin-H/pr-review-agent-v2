[project]
name = "review-agent"
version = "0.1.0"
description = "Autonomous PR Review Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "arq>=0.25.0",
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "groq>=0.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pgvector>=0.3.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["review", "evals"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true